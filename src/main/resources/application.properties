spring.application.name=ford-challenge
server.port=8080

spring.datasource.url=jdbc:h2:file:./data/ford-db;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=false


springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs


jwt.secret=${JWT_SECRET:ford-fiap-sprint3-chave-secreta-de-desenvolvimento-2026}
jwt.expiracao-minutos=60
jwt.emissor=ford-fiap-api